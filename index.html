<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Bienvenido a Korvia!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body style="background-color: #F4F5F6;" class="text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white border border-slate-200/80 rounded-3xl p-8 text-center shadow-xl shadow-slate-200/50 space-y-6">
        
        <!-- Icono / Logo -->
        <div class="w-20 h-20 bg-emerald-50 border-2 border-emerald-500 rounded-full flex items-center justify-center mx-auto text-emerald-600 text-3xl shadow-sm">
            <i class="fas fa-seedling"></i>
        </div>

        <!-- Títulos -->
        <div class="space-y-2">
            <span class="text-xs font-bold tracking-widest uppercase text-emerald-700">KORVIA</span>
            <h1 class="text-2xl font-bold text-slate-900">¡Correo Confirmado con Éxito!</h1>
            <p class="text-sm text-slate-600 leading-relaxed">
                Has dado el primer paso en tu camino hacia el autodescubrimiento y la evolución personal. Tu cuenta está completamente lista.
            </p>
        </div>

        <!-- Tarjeta de inspiración
        <div class="p-4 rounded-2xl bg-emerald-50/60 border border-emerald-100 text-xs text-emerald-900 italic font-medium">
            "El crecimiento personal no es una meta, es un estilo de vida diario."
        </div> -->

        <!-- Botón de acción -->
        <div class="pt-2">
            <p class="text-xs text-slate-500 mb-3">Ya puedes regresar a tu aplicación móvil y comenzar tu viaje.</p>
            <div class="inline-block w-full py-3.5 bg-emerald-600 text-white font-semibold rounded-xl text-sm shadow-md shadow-emerald-600/20 hover:bg-emerald-700 transition cursor-pointer" onclick="alert('¡Ya puedes abrir la app Korvia en tu celular!')">
                <i class="fas fa-mobile-alt mr-2"></i> Abrir Korvia App
            </div>
        </div>

    </div>

</body>
</html>
